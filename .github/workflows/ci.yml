name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: sudo xcode-select -s "/Applications/Xcode_27.1.app"

      - name: Create Release.xcconfig
        run: cp ./BuildConfiguration/Debug.template.xcconfig ./BuildConfiguration/Release.xcconfig

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -scheme BookPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/BookPlayer.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r BookPlayer-Unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BookPlayer-Unsigned-IPA
          path: ${{ runner.temp }}/BookPlayer-Unsigned.ipa
